[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorpio-cli"
version = "0.1.0.5"
description = "Scorpio IoT command-line interface"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pedro Zavala", email = "pedropablozavalatejos@gmail.com" },
    { name = "IoT-UC Laboratory", email = "scorpioiotuc@gmail.com" },
]
maintainers = [
    { name = "Pedro Zavala", email = "pedropablozavalatejos@gmail.com" },
]
dependencies = [
    "paramiko>=3.5,<4",
]

[project.scripts]
scorpio = "scorpio.cli.main:main"

[tool.setuptools.package-data]
"scorpio.ui" = ["*.html", "*.css", "*.js"]
"scorpio.server" = ["*.json"]

[project.urls]
Homepage = "https://github.com/ScorpioIoTUC/scorpio-cli/"
Issues = "https://github.com/ScorpioIoTUC/scorpio-cli/issues"